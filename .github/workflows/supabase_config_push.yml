name: Manual Supabase Config Push

on:
  workflow_dispatch:

jobs:
  supabase-config-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: v2.106.0 # keep in sync with deploy.yml and integration_test.yml until CLI compatibility is reviewed separately

      - name: Supabase link
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push Supabase project config
        # This step updates remote project settings, not database rows.
        # Run only after human confirmation that:
        # - the target branch/environment is correct
        # - Supabase CLI compatibility has been checked
        # - known Storage config schema issues have been reviewed
        run: |
          supabase config push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
